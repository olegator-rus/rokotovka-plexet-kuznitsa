              share: { type: [number, "null"] }
              avg_ms: { type: [number, "null"] }
              avg_cost_rub: { type: [number, "null"] }
              llm_parses: { type: integer }
              cache_hits: { type: integer }
        journal_hidden: { type: boolean, description: "Только в /api/costs/summary: журнал вызовов скрыт, calls пуст" }
        calls:
          type: object
          properties:
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  kind: { type: string, enum: [search, eval, judge, warmup, agent, other] }
                  created_at: { type: string, format: date-time }
                  request_id: { type: [string, "null"] }
                  query: { type: [string, "null"] }
                  agent_run_id: { type: [string, "null"] }
                  provider: { type: string }
                  model: { type: string }
                  input_tokens: { type: integer }
                  output_tokens: { type: integer }
                  cached_tokens: { type: integer }
                  latency_ms: { type: integer }
                  cost_rub: { type: number }
                  pricing_version: { type: string }
                  status: { type: string, enum: [ok, error, timeout, schema_error] }
        monthly:
          type: object
          properties:
            formula: { type: string }
            params:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                    enum: [route_d_share, cache_hit_share, llm_parse_cost_rub, agent_run_cost_rub, agent_runs_month, agent_runs_month_200k, server_rub_20k, server_rub_200k]
                  label: { type: string }
                  value: { type: number }
                  default: { type: number }
                  source: { type: string, enum: [measured, assumed, request] }
                  unit: { type: string }
                  hint: { type: string }
            scenarios:
              type: array
              items:
                type: object
                properties:
                  requests: { type: integer, enum: [20000, 200000] }
                  llm_calls: { type: number }
                  server_rub: { type: number }
                  llm_rub: { type: number }
                  agent_rub: { type: number }
                  total_rub: { type: number }
                  per_request_rub: { type: number }
                  llm_per_request_rub: { type: number }
    EvalJob:
      type: object
      properties:
        id: { type: string }
        set: { type: string }
        configs: { type: array, items: { type: string } }
        status: { type: string, enum: [running, done, failed] }
        done: { type: integer }
        total: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        run_id: { type: string }
        error: { type: string }
    Evaluations:
      type: object
      properties:
        set: { type: string }
        configs:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              run_id: { type: string }
              config: { type: string }
              rules_version: { type: integer }
              set_hash: { type: string }
              queries: { type: integer }
              repro: { type: string }
              created_at: { type: string, format: date-time }
              metrics:
                type: object
                additionalProperties: true
                properties:
                  ndcg10: { type: [number, "null"] }
                  mrr10: { type: [number, "null"] }
                  recall50: { type: [number, "null"] }
                  exact_accuracy: { type: [number, "null"] }
                  empty_rate: { type: [number, "null"] }
                  rescued_rate: { type: [number, "null"] }
                  false_rescue_rate: { type: [number, "null"] }
                  violation_rate: { type: [number, "null"] }
              by_type: { type: object, additionalProperties: true }
              regressions: { type: array, items: { type: object, additionalProperties: true } }
              improvements: { type: array, items: { type: object, additionalProperties: true } }
        running:
          oneOf: [{ $ref: "#/components/schemas/EvalJob" }, { type: "null" }]
        last_job:
          oneOf: [{ $ref: "#/components/schemas/EvalJob" }, { type: "null" }]
        judge_agreement: { type: [object, "null"], additionalProperties: true }
        agent_credit:
          type: [object, "null"]
          description: Честность правок агента в столбце B4 этого набора (null — нет B3 или B4)
          properties:
            counted: { type: boolean, description: "Все принятые правки B4 — из запусков после разреза журнала" }
            pre_holdout: { type: boolean, description: "Есть правки запусков до разреза: B4 — не независимая оценка" }
            note: { type: string }
            rules_version: { type: integer }
        rescued:
          description: Только для set=holdout_week — доля спасённых на реплее отложенной недели
          oneOf:
            - { $ref: "#/components/schemas/HoldoutRescued" }
            - { type: "null" }
    AgentRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, done, stopped, failed] }
        trigger: { type: string, enum: [manual, schedule, spike, catalog_change] }
        query: { type: [string, "null"], description: "Контур автономии: запуск «Разобрать» на одном запросе" }
        read_only: { type: boolean, description: "Режим «только чтение» на момент старта" }
        input: { type: object, additionalProperties: true, description: "Вход триггера: {at, slot, days, why} | {spike: {...}, why} | {fingerprint, from, to, why} | {query}" }
        plan:
          type: [object, "null"]
          description: Последняя редакция плана
          properties:
            revision: { type: integer }
            source: { type: string, enum: [model, fallback] }
            summary: { type: string }
            clusters:
              type: array
              items:
                type: object
                properties:
                  cluster_id: { type: string }
                  label: { type: string }
                  score: { type: number }
                  why: { type: string }
            tools: { type: array, items: { type: string } }
        budget:
          type: [object, "null"]
          properties:
            limits: { type: object, properties: { steps: { type: integer }, tokens: { type: integer }, cost_rub: { type: number }, seconds: { type: integer } } }
            used: { type: object, properties: { steps: { type: integer }, tokens: { type: integer }, cost_rub: { type: number }, seconds: { type: integer } } }
            exhausted: { type: boolean }
        outcome:
          type: [object, "null"]
          properties:
            proposals: { type: integer }
            tasks: { type: integer }
            rollbacks: { type: integer }
            drafts: { type: integer }
            skipped_memory: { type: integer }
            effect_checks: { type: integer }
            helped: { type: integer }
            no_effect: { type: integer }
            harmed: { type: integer }
        unprocessed:
          type: array
          items: { type: object, properties: { cluster_id: { type: string }, label: { type: string }, score: { type: number }, reason: { type: string } } }
        duration_ms: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        days: { type: integer }
        max_clusters: { type: integer }
        clusters_total: { type: integer }
        clusters_done: { type: integer }
        proposals_created: { type: integer }
        tool_calls: { type: integer }
        max_tool_calls: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_rub: { type: number }
        stop_reason:
          type: string
          enum: ["", user, step_limit, token_limit, budget_limit, timeout, llm_error, no_failed_queries, error, steps_budget, cost_budget, time_budget, already_solved, no_findings]
        summary: '{ type: string }'
        current_cluster:
          type: [object, "null"]
          properties:
            id: { type: string }
            label: { type: string }
        model: { type: string }
        rules_version: { type: integer }
        limits:
          type: object
          properties:
            tool_calls_per_cluster: { type: integer }
            hypotheses: { type: integer }
            tokens_per_run: { type: integer }
            timeout_sec: { type: integer }
        episode: { type: [object, "null"], additionalProperties: true }
    AgentSettings:
      type: object
      description: Контур автономии; line — режим, расписание и пороги одной строкой для шапки «Запусков»
      properties:
        read_only: { type: boolean }
        mode_label: { type: string }
        schedule:
          type: object
          properties:
            enabled: { type: boolean }
            at: { type: string }
            interval: { type: string }
            days: { type: integer }
            next_at: { type: [string, "null"] }
        spike:
          type: object
          properties:
            enabled: { type: boolean }
            window: { type: string }
            min_searches: { type: integer }
            empty_share: { type: number }
            reform_share: { type: number }
            query_freq: { type: integer }
            cooldown: { type: string }
        catalog_trigger: { type: boolean }
        max_parallel: { type: integer }
        running: { type: integer }
        budget: { type: object, additionalProperties: true }
        query_budget: { type: object, additionalProperties: true }
        line: { type: string }
        regression:
          type: object
          description: >-
            Контур фида: наборы, на которых агент проверяет правку. На фиде — наборы «по цели» (feed_regression,
            feed_tune); нет наборов — ready=false, message «Наборы регрессии на фиде не заданы», правка не допускается.
          properties:
            sets: { type: array, items: { type: string } }
            by_set: { type: object, additionalProperties: { type: integer } }
            queries: { type: integer }
            max_worse: { type: integer }
            feed: { type: boolean }
            catalog_version: { type: string }
            ready: { type: boolean }
            message: { type: string }
    SearchOpsReport:
      type: object
      description: Контур фида — backend/out/agent_report.go
      properties:
        catalog_version: { type: string }
        rules_version: { type: integer }
        days: { type: integer }
        stream:
          type: object
          properties:
            label: { type: string, description: "тестовый поток: запросы заказчика, прогоны сайта, синтетика из каталога" }
            freq_label: { type: string }
            layers:
              type: array
              items:
                type: object
                properties:
                  code: { type: string, enum: [customer, site, synthetic, live] }
                  label: { type: string }
                  queries: { type: integer }
                  searches: { type: integer }
        totals:
          type: object
          properties:
            searches: { type: integer }
            failed_searches: { type: integer }
            queries: { type: integer }
            failed_queries: { type: integer }
        sections:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [no_offer, not_found, unknown_words, service] }
              title: { type: string }
              hint: { type: string }
              searches: { type: integer }
              failures: { type: integer }
              rows: { type: array, items: { $ref: "#/components/schemas/ReportRow" } }
        pending: { type: array, items: { $ref: "#/components/schemas/ReportRow" } }
        checked_at: { type: string, format: date-time }
        truncated: { type: boolean }
    ReportRow:
      type: object
      properties:
        query: { type: string }
        freq: { type: integer, description: модельная частота }
        failures: { type: integer }
        empty: { type: integer }
        no_click: { type: integer }
        reformulated: { type: integer }
        layers: { type: array, items: { type: string } }
        origin: { type: string }
        kind: { type: string }
        kind_label: { type: string }
        evidence: { type: string }
        found: { type: object, additionalProperties: true }
        words: { type: array, items: { type: string } }
        examples: { type: array, items: { type: string } }
        agent: { type: object, additionalProperties: true, description: "AgentVerdict: code, label, note, diagnosis, run_id, cluster_id" }
        proposal:
          type: object
          properties:
            id: { type: string }
            status: { type: string }
            action: { type: string }
            diagnosis: { type: string }
            run_id: { type: string }
            cluster_id: { type: string }
    AgentStep:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [tool_call, thought, check, memory, diagnosis, hypothesis, proposal, error, plan, memory_read, memory_skip, effect_check, budget], description: "plan, memory_read, memory_skip, effect_check, budget — контур автономии; memory новыми запусками не пишется" }
        cluster_id: { type: [string, "null"] }
        tool: { type: [string, "null"] }
        title: { type: string }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        ok: { type: boolean }
        hypothesis_no: { type: [integer, "null"] }
        rejected_reason: { type: [string, "null"] }
        ms: { type: integer }
    RulePatch:
      type: object
      properties:
        add:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              alias: { type: string }
              canonical: { type: string }
              target: { type: string, enum: [vendor, family, category, term] }
              target_id: { type: string }
        remove: { type: [array, "null"], items: { type: object, additionalProperties: true } }
    Proposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string }
        cluster:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
            queries:
              type: array
              items:
                type: object
                properties:
                  text: { type: string }
                  freq: { type: integer }
                  failures: { type: integer }
            lost_demand: { type: number }
        diagnosis: { $ref: "#/components/schemas/Diagnosis" }
        diagnosis_text: { type: string }
        cause: { $ref: "#/components/schemas/Cause" }
        cause_label: { type: string }
        owner: { type: string, enum: [ecom, product, content, head], description: "Владелец причины: он принимает решение (контур доводки)" }
        owner_label: { type: string }
        role: { type: string, enum: [ecom, product, content, head], description: "= owner (контур доводки)" }
        evidence_level: { type: string }
        technical_status: { type: string, enum: [verified, unverified, failed, ""] }
        economic_status: { type: string, enum: [unknown, estimated, measured, ""] }
        action:
          type: string
          enum: [rules_patch, ticket, relation_patch, rollback, margin_policy, bundle]
          description: "relation_patch — правка справочника связей; rollback — откат, предложенный агентом после проверки эффекта (контур автономии); margin_policy и bundle удалены в контуре доводки — только у stale-предложений"
        patch: { oneOf: [{ $ref: "#/components/schemas/RulePatch" }, { type: "null" }] }
        evaluation: { type: [object, "null"], additionalProperties: true, description: "Прогон: целевой кластер до/после, регрессия, причины" }
        evidence: { type: [object, "null"], additionalProperties: true }
        hypotheses_tried: { type: integer }
        base_version: { type: integer }
        status:
          type: string
          enum: [pending, accepted, rejected, rolled_back, stale]
          description: "stale — принять нельзя: сменился каталог или предложение из запуска до разреза журнала"
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decided_reason: { type: [string, "null"] }
        decided_comment: { type: [string, "null"] }
        stale_reason:
          type: [string, "null"]
          enum: [catalog_changed, pre_holdout, removed_p4, null]
          description: |
            Только у status = stale: catalog_changed — импорт другого каталога (правка проверялась на прежнем
            словаре); pre_holdout — запуск агента до разреза журнала видел отложенную неделю и тексты test
            (`go run . proposals stale --run <id> --reason "<текст>"`, текст — в decided_comment); removed_p4 — тип
            предложения удалён в контуре доводки (миграция при старте, decided_comment «удалено в контуре доводки»).
        config_version: { type: [integer, "null"] }
        effect: { type: [object, "null"], additionalProperties: true }
        check_query: { type: string }
        trigger: { type: string, description: "Контур автономии: триггер запуска, который предложил" }
        run_started_at: { type: [string, "null"], format: date-time }
        task_to_owner: { type: boolean, description: "Контур автономии: задача владельцу вместо правки поиска (action ticket)" }
        rollback_of:
          type: [object, "null"]
          description: "Контур автономии: у предложения отката — что откатывается"
          properties:
            proposal_id: { type: string }
            config_version: { type: integer }
            label: { type: string }
    ProposalDecision:
      type: object
      properties:
        proposal: { $ref: "#/components/schemas/Proposal" }
        config_version: { type: [integer, "null"] }
