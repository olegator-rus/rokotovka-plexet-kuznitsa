openapi: 3.1.0
info:
  title: PLEXeT SearchOps API
  version: "2026-05-27"
  summary: Умный поиск для B2B-магазина ПО и агент SearchOps
  description: |
    HTTP API бэкенда PLEXeT SearchOps. Всё, что видит витрина, доступно через этот API: в пилоте магазин
    может подключить поиск, аналитику, очередь предложений агента и экономику к своему интерфейсу без нашей
    витрины.

    Общие правила:
    - JSON в UTF-8; ответы `/api/*` не кешируются (`Cache-Control: no-store`).
    - Ошибка — всегда конверт `{"error": {"code", "message", "traceId", "details"?}}` (схема `Error`).
      `traceId` совпадает с заголовком `X-Request-Id` и строкой журнала сервера.
    - Изменяющие запросы (POST) принимаются только с заголовком `Origin`, равным `PUBLIC_ORIGIN` магазина
      (защита от CSRF); иначе 403.
    - Вход по ролям: гость, покупатель (`buyer`) и сотрудники `ecom|product|content|head`. Сессия —
      подписанная HttpOnly-cookie `plexet_auth` (Path=/api, SameSite=Lax), её выдают `/api/auth/login|demo-login|demo-switch`.
      Всё, кроме витрины и входа, — только сотруднику: гость — 401 `UNAUTHENTICATED` с
      `WWW-Authenticate: Bearer realm="PLEXeT SearchOps"`, покупатель — 403. Скрипты и CLI — `Authorization: Bearer
      <BACKOFFICE_TOKEN>` (роль `system`); Basic с паролем = токен принимается по-прежнему. Решение чужой зоны — 403
      `PERMISSION_DENIED` «Это решение принимает <роль>». Открыты без входа (`security: []` у операции): GET
      `/api/health`, `/api/meta`, `/api/suggest`, `/api/suggest/recommendations`, `/api/evaluations`,
      `/api/evaluations/commerce`, `/api/costs/summary`, `/api/companions`, `/api/products/{id}`, `/api/auth/*`, `/api/quotes/mine` (проверяет обработчик) и POST
      `/api/search`, `/api/events`, `/api/quotes`. При `AUTH_REQUIRED=off` (только development) без токена — `system`.
    - Квота модели на адрес: разбор запроса моделью (маршрут D) не дороже `LLM_PER_IP_DAILY_RUB` ₽ в сутки с
      одного адреса; сверх неё и сверх дневного бюджета разбор идёт по правилам (`fallback_reason` в трассе:
      `ip_quota`, `budget_exceeded`), поиск не падает.
    - Лимит частоты — `RATE_LIMIT_PER_MIN` запросов в минуту с одного адреса (по умолчанию 600; `/api/health`
      и поток SSE не считаются). Сверх лимита — 429 и заголовки `X-Ratelimit-*`.
    - Срок обработки запроса — 25 с (кроме импорта каталога и потока SSE).
    - Доли — числа 0..1; деньги — рубли; непосчитанное — `null`, а не ноль.
    - Тексты запросов покупателей не пишутся в журнал сервера; в модель уходят только текст запроса и
      обезличенный сегмент покупателя (без идентификаторов клиента и сессии).
servers:
  - url: http://127.0.0.1:8088
    description: локальная разработка (make dev)
security:
  - authCookie: []
  - backofficeBearer: []
  - backofficeBasic: []
tags:
  - name: Поиск
  - name: Аналитика
  - name: Экономика
  - name: Оценка
  - name: Агент
  - name: Предложения и правила
  - name: Служебное
  - name: Вход
paths:
  /health:
    get:
      tags: [Служебное]
      summary: Проверка живости (вне /api, для compose и мониторинга)
      operationId: healthRoot
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /api/health:
    get:
      tags: [Служебное]
      summary: Проверка живости
      description: Всегда 200, пока процесс отвечает; состояние базы, OpenSearch и эмбеддера — в полях.
      operationId: health
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /api/meta:
    get:
      tags: [Служебное]
      summary: Справочная информация для витрины
      description: |
        Режим LLM и плашка режима, версия каталога и правил, конфигурации поиска, покупатели для переключателя,
        флаги контуров коммерции–3 (`features`) и кто смотрит сайт (`viewer`).
      operationId: meta
      security: []
      responses:
        "200":
          description: Метаданные
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
  /api/auth/config:
    get:
      tags: [Вход]
      summary: Способы входа и демо-аккаунты
      operationId: authConfig
      security: []
      responses:
        "200":
          description: Настройки входа; personas пуст, если DEMO_LOGIN_BUTTONS выключен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /api/auth/me:
    get:
      tags: [Вход]
      summary: Кто смотрит сайт
      description: "Гость — 200 с `role: guest`."
      operationId: authMe
      security: []
      responses:
        "200":
          description: "{viewer}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
  /api/auth/login:
    post:
      tags: [Вход]
      summary: Вход по логину и паролю (AUTH_ACCOUNTS)
      description: |
        Ставит cookie `plexet_auth`. bcrypt считается и для несуществующего логина. Лимит попыток — `AUTH_LOGIN_PER_MIN`
        (10) в минуту с адреса, общий для login, demo-login и demo-switch; сверх — 429 с `Retry-After`.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        "200":
          description: "{viewer} + Set-Cookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/demo-login:
    post:
      tags: [Вход]
      summary: Вход демо-аккаунтом (DEMO_LOGIN_BUTTONS)
      operationId: authDemoLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              properties:
                persona: { type: string, examples: [buyer-smb, buyer-enterprise, buyer-gov, staff-ecom, staff-product, staff-content, staff-head] }
      responses:
        "200":
          description: "{viewer} + Set-Cookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "404": { description: Демо-аккаунты выключены }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/demo-switch:
    post:
      tags: [Вход]
      summary: Сменить демо-аккаунт без выхода
      operationId: authDemoSwitch
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              properties:
                persona: { type: string }
      responses:
        "200":
          description: "{viewer} + Set-Cookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: Демо-аккаунты выключены }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      tags: [Вход]
      summary: Выход
      operationId: authLogout
      security: []
      responses:
        "204": { description: Cookie стёрта }
  /api/quotes/mine:
    get:
      tags: [Вход]
      summary: Свои запросы КП вошедшего покупателя
      description: Клиент — из сессии. Гость — 401, сотрудник — 403.
      operationId: quotesMine
      security: []
      responses:
        "200":
          description: "{items: [Quote]} — как GET /api/quotes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/llm-mode:
    post:
      tags: [Служебное]
      summary: Переключить режим LLM без перезапуска
      description: |
        `off` — сложные запросы (маршрут D) разбираются правилами и кэшем, агент не запускается. `on` — только
        если модель настроена. Доступно, когда `ADMIN_ENABLED=on` (по умолчанию — только в development).
      operationId: setLLMMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [on, off] }
      responses:
        "200":
          description: Новое состояние (как meta.llm)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMState" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/admin/vectors-mode:
    post:
      tags: [Служебное]
      summary: Включить или выключить векторы и реранкер без перезапуска (контур доводки)
      description: |
        `off` — шаги dense и rerank пропускаются с причиной `vectors_off`. За `ADMIN_ENABLED` и входом в бэк-офис.
      operationId: setVectorsMode
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [on, off] } } }
      responses:
        "200":
          description: Новое состояние (как meta.vectors)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VectorsState" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/admin/offline-mode:
    post:
      tags: [Служебное]
      summary: Одна настройка «без моделей» — LLM и векторы вместе (контур доводки)
      description: |
        `on` — LLM off и векторы off; `off` — векторы on, LLM on, если модель настроена. За `ADMIN_ENABLED` и входом.
      operationId: setOfflineMode
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [on, off] } } }
      responses:
        "200":
          description: Оба режима после переключения
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm: { $ref: "#/components/schemas/LLMState" }
                  vectors: { $ref: "#/components/schemas/VectorsState" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/search:
    post:
      tags: [Поиск]
      summary: Поиск по каталогу
      description: |
        Каскад: нормализация (раскладка, опечатки, словари) → маршрут A–D → BM25 + векторы + RRF → атрибуты
        лицензии и бизнес-слой. Модель вызывается только на маршруте D и только для разбора намерения; её ответ
        сверяется со справочниками. Поиск пишется в журнал (`search_events`), трасса — в `search_traces`.
      operationId: search
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Выдача с трассой
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/suggest:
    get:
      tags: [Поиск]
      summary: Подсказки при наборе
      operationId: suggest
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string } }
        - { name: intent_id, in: query, schema: { type: string, maxLength: 128 }, description: "поисковое намерение" }
        - { name: session_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 6 }, description: "товаров в панели; по умолчанию 6" }
      description: |
        Прежние `groups` (не больше 8 строк) и секции панели контура выдачи: `mode`, `normalized`,
        `corrected`, `refinements` (≤6), `suggestions` (≤5), `categories` (≤2), `vendors` (≤2), `products` (≤6 семейств),
        `total_hint`, `meta` (время секций, `partial`, `products_cached`, `llm_calls`/`embed_calls`/`rerank_calls` = 0,
        версии). На нажатие — 0 LLM, 0 векторизаций, реранкер выключен. Трасса панели — `GET /api/traces/{X-Request-Id}`.
        Лимит частоты — 20 запросов в секунду с адреса (сверх — 429). Флаг FEATURE_PANEL=off — `mode: off`, секции пустые.
      responses:
        "429": { description: Слишком частые запросы подсказок }
        "200":
          description: groups и секции панели
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  q: { type: string }
                  normalized: { type: string }
                  mode: { type: string, enum: [prefix, empty, short, too_long, off] }
                  corrected:
                    type: [object, "null"]
                    description: Секции подобраны по раскладке или опечатке; строку ввода не переписываем
                    properties:
                      from: { type: string }
                      to: { type: string }
                      kind: { type: string, enum: [layout, typo] }
                  refinements:
                    type: array
                    maxItems: 6
                    description: |
                      Бейджи-уточнения: сначала структурированные условия из значений фасетов кандидатов —
                      тип продукта по категории («для дома»/«для бизнеса»), тип лицензии, число мест с метрикой, срок,
                      метрика, «отечественное» (в реестре), характеристики оборудования; каждое сужает выдачу и
                      проверено числом семейств (`hits`). Затем продолжения верхней подсказки (`field: null`, дописывают
                      текст) — только не дублирующие показанные подсказки и товары. Названное в запросе не предлагается.
                    items: { $ref: "#/components/schemas/Refinement" }
                  suggestions:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        highlight: { type: array, items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 } }
                        kind: { type: string, enum: [query, category] }
                        source: { type: string, enum: [successful_query, catalog_template, popular] }
                        hits: { type: integer }
                        category_id: { type: string, description: "у kind=category" }
                        category_name: { type: string }
                  categories:
                    type: array
                    maxItems: 2
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        share: { type: number }
                  vendors:
                    type: array
                    maxItems: 2
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                  products:
                    type: array
                    maxItems: 6
                    description: Семейства без дублей; точный артикул — один товар первым, маржа его не сдвигает
                    items:
                      type: object
                      properties:
                        family_id: { type: string }
                        family_name: { type: string }
                        product_id: { type: string }
                        title: { type: string }
                        kind: { type: string, enum: [software, hardware] }
                        vendor: { type: string }
                        category: { type: string }
                        mpn: { type: string }
                        license_line: { type: string }
                        specs_line: { type: string }
                        price_from_rub: { type: [number, "null"] }
                        price_mode: { type: string }
                        variants_count: { type: integer }
                        exact: { type: boolean }
                        sku_exact: { type: boolean }
                        delivery_line: { type: [string, "null"] }
                        image_url: { type: [string, "null"] }
                  total_hint: { type: integer, description: "семейств для «Все результаты»" }
                  together:
                    type: array
                    maxItems: 2
                    description: >-
                      «Вместе с этим» (контур эталонов): одно-два дополнения из таблицы классов допродажи
                      (data/softline/upsell_links.csv) для первого семейства `products`; [] — класса нет или дополнений
                      с ценой нет. Только с ценой, одно семейство на вендора, без типа лицензии того же семейства.
                    items: { $ref: "#/components/schemas/PanelTogether" }
                  meta:
                    type: object
                    properties:
                      ms:
                        type: object
                        properties:
                          total: { type: number }
                          suggestions: { type: number }
                          products: { type: number }
                          refinements: { type: number }
                      partial: { type: boolean, description: "товары не успели за 150 мс — секция пуста, кэш дописывается в фоне" }
                      products_cached: { type: boolean }
                      llm_calls: { type: integer, const: 0 }
                      embed_calls: { type: integer, const: 0 }
                      rerank_calls: { type: integer, const: 0 }
                      index_version: { type: integer }
                      catalog_version: { type: string }
                      suggestions_version: { type: integer }
                      request_id: { type: string }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [query, product, vendor, category] }
                        label: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              text: { type: string }
                              id: { type: [string, "null"] }
                              highlight: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
  /api/suggest/recommendations:
    get:
      tags: [Поиск]
      summary: Блок рекомендаций панели поиска
      description: |
        Лестница оснований: spec → exact (точный SKU; или артикул в q) → viewed (FEATURE_PANEL_VIEWED, по умолчанию выкл.)
        → category (популярное в категории). Для первых трёх — проверенные связи контура коммерции, совместимость не unknown.
        Оснований нет или FEATURE_PANEL_RECS=off — `null`.
      operationId: suggestRecommendations
      security: []
      parameters:
        - { name: spec, in: query, schema: { type: string }, description: "id позиций спецификации через запятую (≤10)" }
        - { name: exact, in: query, schema: { type: string, maxLength: 128 }, description: "product_id точного SKU из панели" }
        - { name: q, in: query, schema: { type: string } }
        - { name: viewed, in: query, schema: { type: string, maxLength: 128 } }
        - { name: category, in: query, schema: { type: string, maxLength: 128 } }
        - { name: session_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: intent_id, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: "{basis, title, why, items[Companion ≤3]} или null"
  /api/help:
    get:
      tags: [Поиск]
      summary: Статьи справки (витрина, без входа; контур доводки)
      operationId: help
      security: []
      responses:
        "200":
          description: Статьи
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HelpAnswer" } }
  /api/guide/route:
    post:
      tags: [Подбор]
      summary: Состояние строки поиска — search | search_offer | guide (контур подбора)
      description: Правила SPEC §1, модель не вызывается. Витрина, без входа.
      operationId: guideRoute
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { query: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: Режим и текст строки-предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [search, search_offer, guide] }
                  reason: { type: string }
                  offer: { type: string, description: "текст над выдачей; пусто при mode=search" }
  /api/guide:
    post:
      tags: [Подбор]
      summary: Ход режима подбора (контур подбора)
      description: |
        Модель выбирает идентификаторы и пишет связующую фразу; таблицу, карточки, цены и правила лицензий строит код.
        Сбой модели, бюджет и предел хода — не ошибка: ответ кодом (meta.fallback) или type=fallback. Витрина, без входа.
      operationId: guide
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideRequest" }
      responses:
        "200":
          description: Ответ подбора
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/guide/spec:
    post:
      tags: [Подбор]
      summary: Строка подбора в черновик спецификации — update_spec
      description: Цена перечитывается из каталога. Повтор с тем же op_key не дублирует строку (duplicate=true).
      operationId: guideSpec
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selection_id, offer_id, quantity, op_key]
              properties:
                session_id: { type: string, maxLength: 128 }
                selection_id: { type: string, maxLength: 128 }
                version: { type: integer, minimum: 0, description: "версия черновика, которую видел покупатель" }
                offer_id: { type: string, maxLength: 128 }
                quantity: { type: integer, minimum: 0, maximum: 100000, description: "0 — убрать строку" }
                op_key: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Черновик
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSpec" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/companions:
    get:
      tags: [Поиск]
      summary: Компаньоны к позиции спецификации («К этой позиции»)
      description: |
        Позиция добавлена в спецификацию из обычной выдачи — подбор как у блока «Дополните решение» (якорь —
        сама позиция). Витрина, без входа. Флаг FEATURE_COMPANIONS выключен — пустые списки; upgrade — при
        FEATURE_SOLUTIONS.
      operationId: productCompanions
      security: []
      parameters:
        - { name: product_id, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: quantity, in: query, schema: { type: integer, minimum: 0, maximum: 100000 }, description: "число мест для suggested_quantity; 0 — нет" }
      responses:
        "200":
          description: Обязательные, дополнения и старшая редакция
          content:
            application/json:
              schema:
                type: object
                required: [product_id, required, items, upgrade]
                properties:
                  product_id: { type: string }
                  required: { type: array, items: { $ref: "#/components/schemas/Companion" } }
                  items: { type: array, items: { $ref: "#/components/schemas/Companion" } }
                  upgrade: { oneOf: [{ $ref: "#/components/schemas/Upgrade" }, { type: "null" }] }
        "404": { description: Позиции нет в каталоге }
        "422": { description: Нет product_id или неверное количество }
  /api/products/{id}:
    get:
      tags: [Поиск]
      summary: Страница товара
      description: |
        Позиция каталога для страницы `/product/:id`: условия лицензии, реестр, характеристики, другие варианты
        семейства, совместимость, «С этим покупают» (подбор GET /api/companions без `upgrade`) и аналоги (связи
        substitute). Витрина, без входа; ответ одинаков для всех ролей, полей маржи и популярности нет.
        Данные — из каталога в памяти, индекс поиска не нужен.
      operationId: product
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: "id позиции (product_id)" }
      responses:
        "200":
          description: Позиция каталога
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/events:
    post:
      tags: [Поиск]
      summary: Событие поведения покупателя
      description: Клик, корзина, заказ и действия с выдачей. Событие `search` пишет сам `POST /api/search`.
      operationId: event
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [click, add_to_cart, order, price_request, manager_request, suggest_pick, correction_undo, chip_remove, clarify_answer,
                    companion_impression, companion_click, companion_add, companion_dismiss, spec_remove, template_apply,
                    quote_request, facet_apply, margin_simulate, margin_apply, relation_decision]
                  description: >-
                    Контур коммерции — обязательные поля: companion_impression — payload.anchor, payload.items;
                    companion_click — product_id, payload.class; companion_add — product_id, payload.class, payload.quantity;
                    companion_dismiss — product_id, payload.condition; spec_remove — product_id, payload.origin;
                    template_apply — payload.template_id; quote_request — payload.positions, payload.on_request;
                    facet_apply — payload.key, payload.value; margin_simulate — payload.weight; margin_apply —
                    payload.version_before, payload.version_after; relation_decision — payload.relation_id, payload.decision.
                request_id: { type: string }
                session_id: { type: string, description: "Токен из meta.session; иной — событие пишется без сессии" }
                client_id: { type: string }
                product_id: { type: string }
                position: { type: [integer, "null"] }
                payload: { type: object }
                source: { type: string, enum: [live, traffic], description: "Контур автономии: traffic — генератор mock-трафика стенда (go run . traffic); пусто — live" }
      responses:
        "204": { description: Записано }
        "422": { $ref: "#/components/responses/Error" }
  /api/traces/{request_id}:
    get:
      tags: [Поиск]
      summary: Сохранённая трасса поиска
      operationId: trace
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Трасса и исходный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string }
                  query: { type: string }
                  normalized: { type: string }
                  config: { type: string }
                  route: { type: string, enum: [A, B, C, D] }
                  source: { type: string, enum: [live, compare, mock_log, traffic, ""] }
                  client_id: { type: [string, "null"] }
                  created_at: { type: string, format: date-time }
                  trace: { $ref: "#/components/schemas/Trace" }
        "404": { $ref: "#/components/responses/Error" }
  /api/catalog/import:
    post:
      tags: [Служебное]
      summary: Импорт каталога в OpenSearch и PostgreSQL
      description: Источник — `DATA_DIR`. Пересобирает индекс и справочники; срока обработки нет.
      operationId: importCatalog
      responses:
        "200":
          description: Что загружено
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "503": { $ref: "#/components/responses/Error" }
  /api/analytics:
    get:
      tags: [Аналитика]
      summary: Плитки, воронка и проблемные запросы с причиной и владельцем
      description: >
        Контур доводки: у проблемного запроса — `cause`, `cause_label`, `owner`, `owner_label` (причина из семи и её владелец
        по диагнозу агента; пусто — диагноза нет). Ролевые блоки (`role`, `effect`, `commerce`) удалены в контуре доводки.
      operationId: analytics
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200":
          description: Аналитика за период
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
        "422": { $ref: "#/components/responses/Error" }
  /api/analytics/current:
    get:
      tags: [Аналитика]
      summary: Что действующий поиск отвечает на проблемные запросы сейчас
      description: |
        Берёт самые частые проблемные запросы за период (как в `GET /api/analytics`) и прогоняет каждый через
        действующий поиск — пайплайн B3 на последней принятой версии правил (конфигурация `live`). Поиск идёт без
        записи в журнал: проверка не попадает в аналитику и стоимость. Ответ по запросу кешируется на 10 минут
        для той же версии правил и каталога (`cached: true`). Ошибка поиска по одному запросу не роняет ответ:
        у строки заполняется `error`. Колонка «Сейчас» рядом с «За период» показывает, решена ли проблема уже
        после принятых правок.
      operationId: analyticsCurrent
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
        - { name: limit, in: query, description: Сколько проблемных запросов проверить, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
      responses:
        "200":
          description: Текущая выдача по проблемным запросам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemsNow" }
              example:
                days: 30
                rules_version: 2
                catalog_version: mock-1
                checked_at: "2026-05-27T04:50:00Z"
                items:
                  - { query: продлить антивирус, total: 11, not_in_catalog: false, cached: false }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/costs:
    get:
      tags: [Экономика]
      summary: Стоимость поиска, журнал вызовов модели, месячные сценарии
      description: |
        Итоги по журналам `search_events` (только живые поиски) и `llm_usage`; прогоны оценки, судья и прогрев
        кэша — отдельными строками, в стоимость запроса покупателя не входят. Месячные сценарии 20 и 200 тыс.
        запросов: `вызовов LLM = запросы × доля маршрута D × (1 − доля попаданий в кэш)`, `итого = сервер +
        онлайн-LLM + агент`, `на запрос = итого / запросы`. Сервер и число запусков агента — допущения.
      operationId: costs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - $ref: "#/components/parameters/ServerRub20k"
        - $ref: "#/components/parameters/ServerRub200k"
        - $ref: "#/components/parameters/AgentRunsMonth"
        - $ref: "#/components/parameters/AgentRunsMonth200k"
      responses:
        "200":
          description: Экономика
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Costs" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/costs/summary:
    get:
      tags: [Экономика]
      summary: Открытая сводка стоимости (гость) — без журнала вызовов
      description: |
        Тот же объект, что `GET /api/costs` (маршруты A–D с ценой запроса, средняя, доля без LLM, кэш, прайс,
        месячные сценарии), но `calls` пуст и `journal_hidden: true`: журнал вызовов с текстами запросов — только
        сотруднику. Открыт без входа (вкладка «Доказательства → Стоимость»).
      operationId: costsSummary
      security: []
      parameters:
        - $ref: "#/components/parameters/ServerRub20k"
        - $ref: "#/components/parameters/ServerRub200k"
        - $ref: "#/components/parameters/AgentRunsMonth"
        - $ref: "#/components/parameters/AgentRunsMonth200k"
      responses:
        "200":
          description: Сводка без журнала
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Costs" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/costs/export:
    get:
      tags: [Экономика]
      summary: Данные расчёта стоимости в CSV (для шаблона организатора)
      description: Замеры, маршруты, входные величины с источником (measured | assumed | request), оба месячных сценария, прайс и формула.
      operationId: costsExport
      parameters:
        - $ref: "#/components/parameters/ServerRub20k"
        - $ref: "#/components/parameters/ServerRub200k"
        - $ref: "#/components/parameters/AgentRunsMonth"
        - $ref: "#/components/parameters/AgentRunsMonth200k"
      responses:
        "200":
          description: "CSV, UTF-8 с BOM, колонки: раздел, показатель, ключ, значение, единица, источник, пояснение"
          content:
            text/csv:
              schema: { type: string }
        "503": { $ref: "#/components/responses/Error" }
  /api/evaluations:
    get:
      tags: [Оценка]
      summary: Последний прогон оценки каждой конфигурации на наборе
      description: |
        `holdout_week` — реплей отложенной недели журнала: поиски последних 7 дней журнала, которых агент не видел
        (разрез AGENT_HOLDOUT_FROM), частота запроса — число его поисков за неделю. Набор собран из журнала
        покупателей, поэтому без входа в бэк-офис `query_id` и `text` в `regressions`/`improvements` пустые —
        остаются метрики и число изменений.
      operationId: evaluations
      security: []
        Наборы «по цели» на фиде (контур эталонов): `etalon`, `tz`, `neighbors`, `understanding`, `feed_tune`,
        `feed_regression`, `closed`; их метрики — в `metrics.target`, конфигурации — BM25, B1, B2, live. Тексты
        закрытого набора без входа в бэк-офис не отдаются.
      parameters:
        - { name: set, in: query, schema: { type: string, enum: [tune, test, regression, demo, holdout_week, etalon, tz, neighbors, understanding, feed_tune, feed_regression, closed], default: test } }
      responses:
        "200":
          description: Метрики B0–B4, ухудшения и улучшения, прогресс прогона, согласие LLM-судьи
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluations" }
  /api/evaluations/feed:
    get:
      tags: [Оценка]
      summary: Сводка «На данных заказчика» ()
      description: |
        Из последних прогонов наборов «по цели» (`go run . eval --set etalon,tz,neighbors`, закрытый — `--set closed
        --file …`) и llm_usage: эталоны заказчика у полного продукта (`etalon`), Success@1 закрытой части у BM25,
        гибрида и полного продукта (`closed`, пустой — прогон не запускался), доля ответов с ≥4 семействами и SKU
        (`four`), стоимость запроса по формуле `C = p × (1 − h) × c_llm + (инфраструктура + агент + сопровождение) / N`
        при N = 15 000 для холодного и тёплого прогона (`cost`), таблица «набор × конфигурация» (`table`), каталог
        (`catalog`: источник и число офферов, без версии — в ней дата). p — доля поисков с разбором моделью (вызов или
        кэш): метка маршрута D без вызова модели (zero_results) в p не входит. Текстов запросов нет.
      operationId: feedSummary
      security: []
      responses:
        "200":
          description: Сводка; чего не прогоняли — null или пустой список
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/evaluations/run:
    post:
      tags: [Оценка]
      summary: Запустить прогон оценки в фоне
      operationId: runEvaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                set: { type: string, enum: [tune, test, regression, demo, holdout_week] }
                configs: { type: array, items: { type: string, enum: [B0, B1, B2, B3, B4] } }
      responses:
        "202":
          description: Прогон поставлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalJob" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/agent/runs:
    get:
      tags: [Агент]
      summary: Запуски агента (последние 50)
      operationId: agentRuns
      parameters:
        - name: trigger
          in: query
          description: Фильтр по триггеру (контур автономии); иное — 422
          schema: { type: string, enum: [manual, schedule, spike, catalog_change] }
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
    post:
      tags: [Агент]
      summary: Запустить агента SearchOps
      description: |
        Контур автономии: не больше `AGENT_MAX_PARALLEL` (2) запусков и один каждого вида; иначе 409. Требует
        режим LLM `on` и непревышенный дневной бюджет. `{"query": "…"}` — «Разобрать» на одном запросе (≤ 200 символов,
        только mode search): кластер из одного запроса, память показывается, но не пропускает; точное совпадение уже
        первым — `stop_reason: already_solved` без вызова модели. Автоматические триггеры (schedule, spike,
        catalog_change) запускает сам сервер, не этот метод.
      operationId: startAgentRun
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer, minimum: 1, maximum: 365, default: 30 }
                max_clusters: { type: integer, minimum: 1, maximum: 12, default: 5 }
                trigger: { type: string, enum: [manual, schedule], default: manual }
                query: { type: string, maxLength: 200, description: "Контур автономии: запуск на одном запросе («Разобрать»)" }
                mode:
                  type: string
                  enum: [search, commerce]
                  default: search
                  description: commerce — справочник связей контура коммерции (BROKEN_RELATION, MISSING_REQUIRED); совместные покупки и маржа удалены в контуре доводки
      responses:
        "202":
          description: Запуск начат
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, format: uuid }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/agent/runs/{id}:
    get:
      tags: [Агент]
      summary: Запуск и лента шагов
      operationId: agentRun
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Запуск и шаги
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/AgentRun" }
                  steps: { type: array, items: { $ref: "#/components/schemas/AgentStep" } }
        "404": { $ref: "#/components/responses/Error" }
  /api/agent/runs/{id}/stream:
    get:
      tags: [Агент]
      summary: Лента шагов по SSE
      description: |
        `event: step` (data — AgentStep; обновление шага приходит с тем же id/seq), `event: status` (data —
        AgentRun), `event: done` (data — AgentRun). `id:` = seq. Поток живёт ≤25 с; EventSource
        переподключается с `Last-Event-ID` (или `?after=seq`) и получает только новые шаги.
      operationId: agentRunStream
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: after, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Поток событий
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/agent/runs/{id}/stop:
    post:
      tags: [Агент]
      summary: Остановить запуск
      operationId: stopAgentRun
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202": { description: Остановка запрошена }
        "404": { $ref: "#/components/responses/Error" }
  /api/agent/memory:
    get:
      tags: [Агент]
      summary: Память агента
      description: |
        Без `layer` — решения человека по предложениям (прежняя форма). Контур автономии: `layer=decisions` —
        решения с ролью того, кто решил; `layer=suppress` — «не предлагать» с условием возврата (создаётся отказом
        человека); `layer=episodes` — итоги разборов и проверок эффекта.
      operationId: agentMemory
      parameters:
        - name: layer
          in: query
          schema: { type: string, enum: [decisions, suppress, episodes] }
      responses:
        "200":
          description: Решения (без layer) или записи слоя
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_label: { type: string }
                        cluster_key: { type: string }
                        proposal_id: { type: string }
                        diagnosis: { $ref: "#/components/schemas/Diagnosis" }
                        decision: { type: string, enum: [accepted, rejected, rolled_back] }
                        reason: { type: string }
                        comment: { type: string }
                        ts: { type: string, format: date-time }
                  decisions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        decision: { type: string, enum: [accepted, rejected, rolled_back, suppress_removed] }
                        decided_by: { type: string, description: роль из сессии }
                        decided_by_label: { type: string }
                        trigger: { type: string }
                        cause: { $ref: "#/components/schemas/Cause" }
                  suppress:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: string }
                        cluster_key: { type: string }
                        cluster_label: { type: string }
                        scope: { type: string, enum: [cluster, patch] }
                        return_condition: { type: string }
                        current_failures: { type: [integer, "null"] }
                        status: { type: string, enum: [active, lifted, removed] }
                  episodes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        run_id: { type: string }
                        trigger: { type: string }
                        kind: { type: string, enum: [investigation, effect_check] }
                        cluster_label: { type: string }
                        effect: { type: [string, "null"], enum: [helped, no_effect, harmed, null] }
        "422": { $ref: "#/components/responses/Error" }
  /api/agent/memory/suppress/{id}/remove:
    post:
      tags: [Агент]
      summary: Снять запись «не предлагать» (контур автономии)
      description: Владелец причины, руководитель e-com или служебный доступ; причина обязательна; повтор — 409.
      operationId: agentSuppressRemove
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200": { description: Запись снята, решение suppress_removed записано }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/agent/settings:
    get:
      tags: [Агент]
      summary: Режим агента, расписание, пороги триггеров, пул, бюджет (контур автономии)
      operationId: agentSettings
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
    post:
      tags: [Агент]
      summary: Режим «только чтение» (руководитель e-com или служебный доступ)
      operationId: setAgentSettings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                read_only: { type: boolean }
      responses:
        "200":
          description: Новые настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "403": { $ref: "#/components/responses/Error" }
  /api/agent/report:
    get:
      tags: [Агент]
      summary: Отчёт SearchOps для маркетолога — первый экран (контур фида)
      description: >-
        Неудачные запросы журнала текущего каталога (тестовый поток и живые поиски; mock-журнал не входит) по четырём
        разделам — no_offer, not_found, unknown_words, service — и pending (причина не доказана). Раздел — по
        доказательству: вывод агента, ответ действующего поиска, переформулировка покупателей. Частоты модельные;
        рублей и дат нет. Строка с agent.run_id и agent.cluster_id раскрывается в ленту шагов запуска.
      operationId: agentReport
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
      responses:
        "200":
          description: Отчёт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchOpsReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/proposals:
    get:
      tags: [Предложения и правила]
      summary: Очередь предложений агента
      operationId: proposals
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected, rolled_back, stale] } }
        - { name: role, in: query, description: "Владелец причины (контур доводки)", schema: { type: string, enum: [ecom, product, content, head] } }
        - { name: cause, in: query, description: "Причина (контур доводки)", schema: { $ref: "#/components/schemas/Cause" } }
      responses:
        "200":
          description: Предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Proposal" } }
  /api/proposals/{id}:
    get:
      tags: [Предложения и правила]
      summary: Предложение с доказательствами
      operationId: proposal
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Предложение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "404": { $ref: "#/components/responses/Error" }
  /api/proposals/{id}/approve:
    post:
      tags: [Предложения и правила]
      summary: Принять предложение
      description: 'Правка правил — новая версия правил (B4); задача (`action: ticket`) — «взять в работу», версия не создаётся.'
      operationId: approveProposal
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Решение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalDecision" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/proposals/{id}/reject:
    post:
      tags: [Предложения и правила]
      summary: Отклонить предложение (агент запомнит причину)
      operationId: rejectProposal
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [too_broad, wrong_product, not_now, other] }
                comment: { type: string, description: "обязателен для reason=other" }
      responses:
        "200":
          description: Решение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalDecision" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/configs:
    get:
      tags: [Предложения и правила]
      summary: Версии правил поиска
      operationId: configs
      responses:
        "200":
          description: Версии, новые сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        created_at: { type: string, format: date-time }
                        author: { type: string, enum: [agent+human, human, system] }
                        source: { type: string, enum: [import, agent, rollback] }
                        description: { type: string }
                        proposal_id: { type: [string, "null"] }
                        aliases: { type: integer }
                        diff: { $ref: "#/components/schemas/RulePatch" }
                        effect: { type: [object, "null"] }
                        catalog_version: { type: string, description: "Каталог, для которого собраны правила" }
                        archived:
                          type: boolean
                          description: "Версия прежнего каталога: после импорта другого каталога цепочка начинается заново, откат к ней — 409"
  /api/configs/rollback:
    post:
      tags: [Предложения и правила]
      summary: Откат правил — новая версия, равная выбранной
      operationId: rollbackConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_version]
              properties:
                to_version: { type: integer, minimum: 1 }
                comment: { type: string }
      responses:
        "200":
          description: Новая версия
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  rolled_back_to: { type: integer }
                  rolled_back_proposals: { type: array, items: { type: string } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/relations:
    get:
      tags: [Предложения и правила]
      summary: Действующий справочник связей (контур коммерции)
      operationId: relations
      parameters:
        - { name: family, in: query, schema: { type: string }, description: связи, где семейство — источник или цель }
        - { name: status, in: query, schema: { type: string, enum: [approved, pending, rejected] } }
        - { name: type, in: query, schema: { type: string, enum: [substitute, complement, renewal, compatibility, upgrade] } }
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200":
          description: Связи действующей версии
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  materialized: { type: boolean, description: false — версий ещё нет, справочник = каталог }
                  catalog_version: { type: string }
                  stale_after_days: { type: integer }
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      description: связь relations.json плюс from_name, to_name, needs_review
                      additionalProperties: true
        "422": { $ref: "#/components/responses/Error" }
  /api/relations/versions:
    get:
      tags: [Предложения и правила]
      summary: Версии справочника связей (config_versions.kind = relations)
      operationId: relationVersions
      responses:
        "200":
          description: Версии, новые сверху
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        created_at: { type: string, format: date-time }
                        author: { type: string }
                        source: { type: string, enum: [import, agent, rollback] }
                        description: { type: string }
                        proposal_id: { type: string, nullable: true }
                        diff: { type: object, description: "{add, remove, update:[{before, after}]}" }
                        relations: { type: integer }
                        catalog_version: { type: string }
                        archived: { type: boolean }
        "503": { $ref: "#/components/responses/Error" }
  /api/relations/rollback:
    post:
      tags: [Предложения и правила]
      summary: Откат справочника связей — новая версия, равная выбранной
      operationId: rollbackRelations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_version]
              properties:
                to_version: { type: integer, minimum: 1 }
                comment: { type: string }
      responses:
        "200":
          description: Новая версия
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  rolled_back_to: { type: integer }
                  rolled_back_proposals: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/evaluations/contribution:
    get:
      tags: [Оценка]
      summary: Вклад компонентов — последний прогон таблицы (контур доводки)
      operationId: contributionEvaluation
      security: []
      parameters:
        - { name: set, in: query, schema: { type: string, enum: [test, tune, regression], default: test } }
      responses:
        "200":
          description: Лестница B0→B3, полный путь без одного компонента, проверки, предварительные решения
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { type: string }
                  run: { type: object, nullable: true, additionalProperties: true }
                  running: { type: object, nullable: true, additionalProperties: true }
                  last_job: { type: object, nullable: true, additionalProperties: true }
                  modes:
                    type: object
                    properties:
                      llm: { $ref: "#/components/schemas/LLMState" }
                      vectors: { $ref: "#/components/schemas/VectorsState" }
                  notes: { type: array, items: { type: string } }
        "422": { $ref: "#/components/responses/Error" }
  /api/evaluations/contribution/run:
    post:
      tags: [Оценка]
      summary: Запустить прогон таблицы вклада в фоне (бэк-офис)
      operationId: runContribution
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { set: { type: string, enum: [test, tune, regression] } } }
      responses:
        "202": { description: Задание прогона (EvalJob) }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/evaluations/commerce:
    get:
      tags: [Оценка]
      summary: Коммерческая лестница C0–C3 на наборе p2 (последний прогон make eval SET=p2)
      operationId: commerceEvaluation
      security: []
      parameters:
        - { name: set, in: query, schema: { type: string, enum: [p2], default: p2 } }
      responses:
        "200":
          description: Лестница и прогоны с одним изменённым компонентом
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  set: { type: string }
                  ready: { type: object, properties: { hardware: { type: boolean }, companions: { type: boolean }, margin: { type: boolean } } }
                  ladder: { type: array, items: { type: object, additionalProperties: true } }
                  single_changes: { type: array, items: { type: object, additionalProperties: true } }
                  notes: { type: array, items: { type: string } }
        "422": { $ref: "#/components/responses/Error" }
  /api/margin/policy:
    get:
      tags: [Маржа]
      summary: Действующая политика маржи (вес рычага), положения, защиты, история версий
      description: >
        Версии — config_versions kind=margin; версия 0 — исходная (вес контура поиска = 0.05, в базе её нет).
        stop_weight — упор рычага по последней симуляции на tune (null — симуляции не было).
      operationId: getMarginPolicy
      responses:
        "200":
          description: Политика
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  weight: { type: number }
                  categories: { type: object, additionalProperties: { type: number }, description: "Веса по категориям поверх weight" }
                  category_names: { type: object, additionalProperties: { type: string } }
                  base_weight: { type: number, description: "0.05 — выдача контура поиска" }
                  positions: { type: array, items: { type: number }, description: "0, 0.03, 0.05, 0.08, 0.12, 0.15" }
                  guards:
                    type: object
                    properties:
                      exact_query: { type: boolean }
                      exact_top1: { type: boolean }
                      group_lock: { type: boolean }
                      compatibility: { type: boolean }
                      max_shift: { type: integer }
                  epsilon: { type: number }
                  max_shift: { type: integer }
                  stop_weight: { type: [number, "null"] }
                  synthetic: { type: boolean, description: "Маржа в данных синтетическая (catalog.synthetic)" }
                  enabled: { type: boolean, description: "FEATURE_MARGIN_POLICY" }
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        weight: { type: number }
                        categories: { type: object, additionalProperties: { type: number } }
                        source: { type: string, enum: [default, human, rollback, agent], description: "agent — версии до контура доводки (MARGIN_OPPORTUNITY удалён)" }
                        author: { type: string }
                        comment: { type: string }
                        created_at: { type: [string, "null"], format: date-time }
    post:
      tags: [Маржа]
      summary: Применить положение рычага — новая версия политики
      description: >
        Вес — одно из положений; положение за упором (share_over_eps > 0 на tune) — 422; то же, что действует, — 409;
        без базы — 503. Первая проверка упора может прогнать базовую выдачу tune (до ~20 с).
        `categories` — веса по категориям поверх общего (nil — прежние, {} — снять); упор изменённой
        категории проверяется симуляцией с `category`. Предложения агента по марже (`proposal_id`,
        MARGIN_OPPORTUNITY) удалены в контуре доводки: рычаг двигает только человек.
      operationId: applyMarginPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Нужен weight или categories
              properties:
                weight: { type: number }
                categories: { type: object, additionalProperties: { type: number } }
                comment: { type: string }
      responses:
        "201": { description: Новая версия, content: { application/json: { schema: { $ref: "#/components/schemas/MarginApplied" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/margin/policy/rollback:
    post:
      tags: [Маржа]
      summary: Откат политики маржи — новая версия, равная выбранной (0 — исходная 0.05)
      operationId: rollbackMarginPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_version]
              properties:
                to_version: { type: integer, minimum: 0 }
                comment: { type: string }
      responses:
        "201": { description: Новая версия, content: { application/json: { schema: { $ref: "#/components/schemas/MarginApplied" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/margin/simulate:
    post:
      tags: [Маржа]
      summary: Симуляция положений рычага на размеченном наборе (tune по умолчанию)
      description: >
        Базовая выдача набора (поиск витрины до политики) собирается в фоне один раз на каталог и версию правил и
        кэшируется; положения применяются к ней тем же кодом, что в поиске. Если сбор не уложился в срок запроса —
        503 «ещё считается», прогресс — GET /api/margin/simulate/status. Ничего не меняет в боевом поиске.
      operationId: simulateMargin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                set: { type: string, enum: [tune, test, regression, demo] }
                positions: { type: array, items: { type: number } }
                category: { type: string, description: "положения только для позиций категории, остальные — по действующей политике; в ответе scope" }
      responses:
        "200":
          description: Показатели по положениям
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { type: string }
                  set_hash: { type: string }
                  queries: { type: integer }
                  judged: { type: integer }
                  epsilon: { type: number }
                  base_ndcg10: { type: number }
                  base_weight: { type: number }
                  current_weight: { type: number }
                  policy_version: { type: integer }
                  stop_weight: { type: number, description: "Упор: последнее положение вверх от 0.05 с share_over_eps = 0" }
                  min_weight: { type: number }
                  catalog_version: { type: string }
                  rules_version: { type: integer }
                  scope:
                    type: [object, "null"]
                    properties:
                      category_id: { type: string }
                      category: { type: string }
                      queries_in_scope: { type: integer }
                      judged_in_scope: { type: integer }
                      current_weight: { type: number }
                      others: { type: string }
                  synthetic: { type: boolean }
                  cached: { type: boolean }
                  duration_ms: { type: integer }
                  note: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        weight: { type: number }
                        ndcg10: { type: number }
                        ndcg_delta_mean: { type: number }
                        ndcg_delta_p10: { type: number }
                        share_over_eps: { type: number, description: "Доля размеченных запросов с потерей NDCG@10 > ε без бюджета ε (как в живом поиске)" }
                        margin_index: { type: number }
                        margin_index_relevant: { type: number }
                        top1_changed: { type: integer }
                        top3_changed: { type: integer }
                        exact_top1_changed: { type: integer }
                        guards_fired: { type: integer }
                        guards_by_kind: { type: object, additionalProperties: { type: integer } }
                        epsilon_rollbacks: { type: integer }
                        queries_with_shifts: { type: integer }
                        available: { type: boolean }
                        affected:
                          type: array
                          items:
                            type: object
                            properties:
                              query_id: { type: string }
                              query: { type: string }
                              type: { type: string }
                              ndcg_before: { type: [number, "null"] }
                              ndcg_after: { type: [number, "null"] }
                              ndcg_delta: { type: number }
                              top1_changed: { type: boolean }
                              top3_changed: { type: boolean }
                              guards: { type: array, items: { type: string } }
                              before: { type: array, items: { $ref: "#/components/schemas/MarginItemRef" } }
                              after: { type: array, items: { $ref: "#/components/schemas/MarginItemRef" } }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/margin/simulate/status:
    get:
      tags: [Маржа]
      summary: Прогресс сбора базовой выдачи для симуляции
      operationId: marginSimulateStatus
      responses:
        "200":
          description: Состояние
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  done: { type: integer }
                  total: { type: integer }
components:
  securitySchemes:
    backofficeBearer:
      type: http
      scheme: bearer
      description: "Токен бэк-офиса (BACKOFFICE_TOKEN) — скрипты и CLI"
    backofficeBasic:
      type: http
      scheme: basic
      description: "Basic: пользователь любой, пароль — токен бэк-офиса (второй замок Caddy, по умолчанию выключен)"
    authCookie:
      type: apiKey
      in: cookie
      name: plexet_auth
      description: "Сессия входа по ролям: подписанная HttpOnly-cookie от /api/auth/login|demo-login"
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ServerRub20k: { name: server_rub_20k, in: query, description: "Допущение: сервер при 20 тыс. запросов, ₽/мес (7500)", schema: { type: number, minimum: 0 } }
    ServerRub200k: { name: server_rub_200k, in: query, description: "Допущение: сервер при 200 тыс. запросов, ₽/мес (15000)", schema: { type: number, minimum: 0 } }
    AgentRunsMonth: { name: agent_runs_month, in: query, description: "Допущение: запусков агента в месяц при 20 тыс. запросов (30)", schema: { type: number, minimum: 0 } }
    AgentRunsMonth200k: { name: agent_runs_month_200k, in: query, description: "Допущение: запусков агента в месяц при 200 тыс. запросов (120)", schema: { type: number, minimum: 0 } }
  responses:
    Error:
      description: Ошибка в едином конверте
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Health:
      description: Процесс жив
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, const: ok }
              db: { type: string, enum: [ok, down] }
              search: { type: string, enum: [ok, down] }
              embedder: { type: string, enum: [ok, down, off] }
              time: { type: string, format: date-time }
  schemas:
    GuideRequest:
      type: object
      properties:
        session_id: { type: string, maxLength: 128 }
        query: { type: string, maxLength: 500 }
        message: { type: string, maxLength: 500 }
        chip:
          type: object
          properties: { key: { type: string, maxLength: 64 }, value: { type: string, maxLength: 128 } }
        condition:
          type: object
          properties: { key: { type: string, maxLength: 64 }, value: { type: [string, "null"], description: "null — снять условие" } }
        state: { $ref: "#/components/schemas/GuideState" }
    GuideState:
      type: object
      properties:
        selection_id: { type: string }
        intent: { type: string }
        requirements:
          type: object
          properties:
            task: { type: string }
            vendor: { type: string }
            objects: { type: array, items: { type: object, properties: { kind: { type: string, enum: [workstation, server, user, connection] }, count: { type: integer } } } }
            platform: { type: string }
            operation: { type: string, enum: [new, renewal] }
            term_months: { type: integer }
            org_type: { type: string }
            required_features: { type: array, items: { type: string } }
            use: { type: string }
            variant: { type: string }
            cheapest: { type: boolean }
        origin: { type: object, additionalProperties: { type: string, enum: [user, default, inferred] } }
        candidate_family_ids: { type: array, items: { type: string } }
        selected_offer_ids: { type: array, items: { type: string } }
        fact_ids: { type: array, items: { type: string } }
        unresolved: { type: array, items: { type: string } }
        feed_version: { type: string }
        kb_version: { type: string }
        turn: { type: integer }
        questions: { type: integer }
        skipped: { type: integer }
        pending: { type: string }
    GuideResponse:
      type: object
      properties:
        type: { type: string, enum: [comparison, selection, clarification, no_data, out_of_scope, fallback] }
        lead: { type: string }
        claims:
          type: array
          items:
            type: object
            properties:
              fact_id: { type: string }
              text: { type: string }
              source: { type: object, properties: { title: { type: string }, url: { type: string }, fragment: { type: string } } }
              status: { type: string }
        comparison:
          type: [object, "null"]
          properties:
            columns: { type: array, items: { type: object, properties: { family_id: { type: string }, title: { type: string }, family_url: { type: string } } } }
            rows:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  kind: { type: string, enum: [feature, commercial] }
                  note: { type: string }
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [yes, no, value, unknown] }
                        value: { description: "число (₽) или текст" }
                        fact_id: { type: string }
        offers:
          type: array
          items:
            type: object
            properties:
              offer_id: { type: string }
              family_id: { type: string }
              title: { type: string }
              family_title: { type: string }
              sku: { type: string }
              tier: { type: string }
              unit: { type: string }
              quantity: { type: integer }
              price_per_unit: { type: [number, "null"] }
              total: { type: [number, "null"] }
              price_state: { type: string, enum: [priced, on_request] }
              offer_url: { type: string }
              term: { type: string }
              role: { type: string, enum: [match, alternative, rejected] }
              note: { type: string }
              rule_id: { type: string }
              rule_source: { type: string }
        clarification:
          type: [object, "null"]
          properties:
            key: { type: string }
            question: { type: string }
            required: { type: boolean }
            chips: { type: array, items: { type: object, properties: { label: { type: string }, key: { type: string }, value: { type: string } } } }
        conditions:
          type: array
          items: { type: object, properties: { key: { type: string }, label: { type: string }, value: { type: string }, origin: { type: string, enum: [user, default, inferred] } } }
        changes: { type: array, items: { type: object, properties: { condition: { type: string }, effect: { type: string } } } }
        next: { type: array, items: { type: string, enum: [add_to_spec, change_conditions, request_quote] } }
        trace: { type: array, items: { type: object, properties: { step: { type: string }, tool: { type: string }, ms: { type: number }, result: { type: string } } } }
        state: { $ref: "#/components/schemas/GuideState" }
        preliminary: { type: boolean }
        notice: { type: string }
        gaps: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            turn_id: { type: string }
            llm_calls: { type: integer }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cost_rub: { type: number }
            ms_first: { type: number }
            ms_checked: { type: number }
            ms_total: { type: number }
            fallback: { type: string }
            removed: { type: integer }
    GuideSpec:
      type: object
      properties:
        version: { type: integer }
        lines:
          type: array
          items:
            type: object
            properties:
              offer_id: { type: string }
              family_id: { type: string }
              title: { type: string }
              sku: { type: string }
              tier: { type: string }
              quantity: { type: integer }
              price_per_unit: { type: [number, "null"] }
              total: { type: [number, "null"] }
              price_state: { type: string, enum: [priced, on_request] }
              offer_url: { type: string }
        total_rub: { type: [number, "null"] }
        on_request: { type: integer }
        unresolved: { type: array, items: { type: string } }
        duplicate: { type: boolean }
    MarginApplied:
      type: object
      properties:
        version: { type: integer }
        weight: { type: number }
        version_before: { type: integer }
        weight_before: { type: number }
        rolled_back_to: { type: integer }
        categories: { type: object, additionalProperties: { type: number } }
        categories_before: { type: object, additionalProperties: { type: number } }
    MarginItemRef:
      type: object
      properties:
        product_id: { type: string }
        title: { type: string }
        grade: { type: [integer, "null"] }
        margin: { type: number, description: "Перцентиль маржи в категории (0–1; нет маржи — 0.5)" }
        moved: { type: integer, description: "+1 — поднялась на позицию, −2 — опустилась на две" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code:
              type: string
              examples: [VALIDATION_FAILED, PERMISSION_DENIED, NOT_FOUND, CONFLICT, TOO_MANY_REQUESTS, UPSTREAM_UNAVAILABLE]
            message: { type: string, description: Текст для человека по-русски }
            traceId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
    Refinement:
      type: object
      description: Бейдж-уточнение. С field — структурированное условие (фильтр выдачи, строку не меняет); без field — дописывает текст query
      required: [label, query, field, value, op, hits]
      properties:
        label: { type: string, examples: ["для бизнеса", "продление", "5 устройств", "память 16 ГБ"] }
        query: { type: string }
        field: { type: [string, "null"], description: "ключ фильтра: category, license_type, license_quantity, duration_months, license_metric, in_reestr, delivery или характеристика оборудования (ram_gb …)" }
        value: { type: [string, "null"] }
        op: { type: [string, "null"], enum: [eq, null] }
        hits: { type: integer, description: "семейств с этим значением" }
    Viewer:
      type: object
      description: Кто смотрит сайт
      properties:
        role: { type: string, enum: [guest, buyer, ecom, product, content, head, system] }
        role_label: { type: string }
        name: { type: string }
        client_id: { type: [string, "null"] }
        client_name: { type: [string, "null"] }
        persona: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
    AuthMe:
      type: object
      properties:
        viewer: { $ref: "#/components/schemas/Viewer" }
    AuthConfig:
      type: object
      properties:
        demo_login: { type: boolean }
        auth_required: { type: boolean }
        password_login: { type: boolean }
        personas:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              initials: { type: string }
              role: { type: string }
              role_label: { type: string }
              title: { type: string }
              note: { type: string }
              client_id: { type: [string, "null"] }
              client_name: { type: [string, "null"] }
              client_hint: { type: [string, "null"] }
              pending: { type: [integer, "null"], description: "ждущие решения предложения роли; null — нет очереди" }
    Cause:
      type: string
      description: |
        Семь причин неудачного поиска (контур доводки) и владелец: not_understood «Поиск не понял запрос» и
        ranked_low «Нужный товар стоит низко или задублирован» — ecom (администратор поиска); content_gap «В карточке
        не хватает данных» — content (каталог); not_in_catalog «Товара нет в каталоге» и relation_rule «Ошибка в связи
        или лицензионном правиле» — product (категорийный и лицензионный менеджер); non_product «Запрос не о товаре» —
        ecom; noise «Шум или недостаточно данных» — head (ручной разбор).
      enum: [not_understood, ranked_low, content_gap, not_in_catalog, relation_rule, non_product, noise]
    Diagnosis:
      type: string
      description: >
        Подпричина (код агента); причина и владелец — `cause`, `owner` (контур доводки). MISSING_RELATION,
        BUNDLE_OPPORTUNITY, MARGIN_OPPORTUNITY удалены в контуре доводки и встречаются только у stale-предложений
        (`stale_reason: removed_p4`).
      enum: [ALIAS_GAP, TYPO, ASSORTMENT_GAP, SUBSTITUTE_AVAILABLE, CONTENT_GAP, RANKING_FAILURE, CONSTRAINT_CONFLICT, NON_PRODUCT, NOISE, UNKNOWN, BROKEN_RELATION, MISSING_REQUIRED, MISSING_RELATION, BUNDLE_OPPORTUNITY, MARGIN_OPPORTUNITY]
    VectorsState:
      type: object
      description: Режим векторов (эмбеддер и реранкер), контур доводки
      properties:
        mode: { type: string, enum: [on, off] }
        online: { type: boolean }
        changed_at: { type: string, format: date-time, nullable: true }
        offline: { type: boolean, description: "LLM и векторы выключены — режим «без моделей»" }
        banner: { type: string, nullable: true }
    LLMState:
      type: object
      properties:
        mode: { type: string, enum: [on, off] }
        online: { type: boolean, description: Модель настроена }
        changed_at: { type: [string, "null"], format: date-time }
        budget:
          type: object
          properties:
            day: { type: string, format: date, description: Сутки по Москве }
            daily_rub: { type: [number, "null"], description: "LLM_DAILY_BUDGET_RUB; null — без потолка" }
            spent_today_rub: { type: number }
            exceeded: { type: boolean }
        banner: { type: [string, "null"], description: Текст плашки режима в шапке }
    Meta:
      type: object
      properties:
        llm_mode: { type: string, enum: [on, off] }
        catalog_version: { type: string }
        rules_version: { type: integer }
        configs: { type: array, items: { type: string } }
        default_config: { type: string }
        clients:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              segment: { type: string, enum: [smb, enterprise, gov, individual] }
              hint: { type: string }
        llm: { $ref: "#/components/schemas/LLMState" }
        admin_enabled: { type: boolean }
        rate_limit_per_min: { type: integer }
        session:
          type: string
          description: >-
            Подписанный сервером токен сессии покупателя «s-<16 hex>.<HMAC>». Фронт шлёт его в session_id поиска и
            событий (или заголовком X-Session); в журнал попадает только номер сессии с верной подписью, самодельный
            session_id пишется как «без сессии». X-Session с действующим токеном в запросе к /api/meta продлевает
            сессию.
        features:
          type: object
          description: Флаги контура коммерции (FEATURE_*)
          properties:
            hardware: { type: boolean }
            companions: { type: boolean }
            margin_policy: { type: boolean }
            solutions: { type: boolean }
            results_v3: { type: boolean, description: "страница результатов контура выдачи (FEATURE_RESULTS_V3)" }
            panel: { type: boolean, description: "панель поиска контура выдачи (FEATURE_PANEL)" }
            panel_products: { type: boolean }
            panel_margin: { type: boolean }
            panel_recs: { type: boolean }
            panel_viewed: { type: boolean, description: "основание «недавно просмотренное» (по умолчанию выкл.)" }
        viewer: { $ref: "#/components/schemas/Viewer" }
        synthetic:
          type: array
          items: { type: string }
          description: Что в данных придумано (catalog.synthetic, например margin, orders) → плашка «Синтетические данные»
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 200 }
        client_id: { type: string, description: "guest или id покупателя; влияет на контекст ранжирования, в модель не уходит" }
        session_id: { type: string, description: "Токен из meta.session; иной — поиск пишется без сессии" }
        config: { type: string, enum: [live, B0, B1, B2, B3, B4], default: live, description: "live — витрина на действующей версии правил; B0–B4 — лестница оценки" }
        as_typed: { type: boolean, description: Искать как набрано, без исправления }
        removed_chips:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              value: { type: string }
        clarify: { type: object, additionalProperties: { type: string } }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        source: { type: string, enum: [live, compare, traffic], description: "compare — в журнал, но не в аналитику и стоимость; traffic — генератор mock-трафика стенда (контур автономии): для агента живой журнал, в аналитике отдельный источник" }
        sort:
          type: string
          enum: [recommended, relevance, price_asc, price_desc, delivery]
          description: "Контур выдачи (§11.5). Пусто — recommended; relevance — без маржи и бизнес-слоя; «по запросу» при сортировке по цене — в конце"
        group: { type: string, enum: [family, none], description: "Свёртка по семействам; на точном артикуле выключена" }
        intent_id: { type: string, maxLength: 64, description: "Поисковое намерение (§11.1), только в журнал" }
        filters:
          type: array
          maxItems: 20
          description: |
            Фасеты контура коммерции (характеристики оборудования) и ключи страницы результатов контура выдачи (§11.5):
            `category`, `vendor`, `license_type`, `license_metric`, `license_quantity`, `duration_months`, `in_reestr`,
            `price_rub`, `has_price` (with_price|on_request), `delivery` (electronic|oem|physical). `category`/`vendor`
            с op eq (переход из панели) дописывают после найденного семейства категории по популярности
            (`trace.items[].signals: ["filter_fill"]`).
          items:
            type: object
            required: [key, op, value]
            properties:
              key: { type: string, example: ram_gb }
              op: { type: string, enum: [eq, gte, lte, range, not] }
              value: {}
              value2: { description: "Вторая граница диапазона (op=range)" }
    SearchItem:
      type: object
      properties:
        product_id: { type: string }
        family_id: { type: string }
        title: { type: string }
        vendor: { type: string }
        category: { type: string }
        license_line: { type: string }
        price_rub: { type: [number, "null"] }
        price_on_request: { type: boolean }
        group: { type: string, enum: [exact, match, analog] }
        matches_query: { type: boolean }
        purchased_before: { type: boolean }
        final: { type: number }
        kind: { type: string, enum: [software, hardware] }
        mpn: { type: string, description: Парт-номер производителя; "" у ПО }
        price_mode: { type: string, enum: [fixed, from, quote_required, customer_specific, unavailable] }
        compatibility:
          type: [object, "null"]
          properties:
            target_model: { type: string }
            state: { type: string, enum: [verified, conditional, incompatible, unknown] }
            condition: { type: string }
        required: { type: array, items: { $ref: "#/components/schemas/Companion" }, description: Условно обязательное к позиции }
        variants: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }
        price_from_rub: { type: [number, "null"], description: "Контур выдачи: минимум по вариантам с ценой" }
        attrs:
          type: object
          description: Контур выдачи, строка атрибутов карточки-семейства
          properties:
            edition: { type: string }
            license_type: { type: string }
            license_metric: { type: string }
            license_quantity: { type: [integer, "null"] }
            duration_months: { type: [integer, "null"] }
            delivery: { type: string, enum: [electronic, oem, physical, ""] }
            in_reestr: { type: boolean }
        reestr:
          type: [object, "null"]
          description: "Контур доводки: статус в реестре российского ПО в трёх состояниях; у ПО"
          properties:
            status: { type: string, enum: [confirmed, not_matching, unknown] }
            number: { type: string }
            label: { type: string }
            checked_at: { type: string }
        analog_note: { type: string, description: "Контур доводки: у аналога отсутствующего товара — «Не «…», а другой продукт: …»" }
        offer_url: { type: string, description: "Контур фида: страница позиции на сайте магазина (фид); в mock нет" }
        family_url: { type: string, description: "Контур фида: страница семейства на сайте (собрана по хлебным крошкам); пусто — не собрана" }
        vendor_url: { type: string, description: "Контур фида: страница вендора на сайте" }
        available: { type: boolean, description: "Контур фида: в наличии по фиду; нет поля — источник наличие не сообщает" }
        old_price_rub: { type: number, description: "Контур фида: прежняя цена из фида; скидка — при old_price_rub > price_rub > 0" }
        license_kind: { type: string, enum: [base, renewal, upgrade, migration, support, module, course, other], description: "Контур фида: вид позиции по типу лицензии" }
        tier_min: { type: integer, description: "ступень цены за единицу «от N»: price_rub — за одно место, итог = price_rub × число мест; нет поля — ступени нет (цена за пакет)" }
        tier_max: { type: [integer, "null"], description: "верхняя граница ступени; нет поля при tier_min — «от N и больше»" }
        match_type:
          type: string
          enum: [exact, variant, related, alternative, fallback]
          description: |
            Контур фида ступень лестницы «минимум 4 товара» — точное совпадение, другой вариант
            лицензии того же семейства (точный артикул), похожее, «Можно купить сейчас» (точное только по запросу),
            «Популярное в наличии» (шаги 1–4 дали меньше четырёх семейств; в метрики релевантности не входит).
            Есть у каждой карточки, у вложенных variants нет.
        price_state: { type: string, enum: [priced, on_request], description: "Контур фида: priced — есть price_from, иначе «Цена по запросу»" }
        price_from: { type: number, description: "Контур фида: цена «от» — минимум среди позиций семейства в наличии с ценой > 0, проходящих условия запроса (matches_query); нет поля — по запросу" }
        badges: { type: array, items: { type: string }, description: "Контур фида: подписи карточки — «Скидка N%» по old_price_rub у головы с действующей ценой" }
        explain: { type: string, description: "Контур фида: почему карточка здесь — «совпадение с названием семейства», «точный артикул», подпись альтернативы и т. п." }
    Upgrade:
      description: «Старшая редакция» (связь upgrade, 1–2 строки upgrade_adds) — Companion с классом upgrade
      allOf:
        - $ref: "#/components/schemas/Companion"
        - type: object
          required: [for_product_id, relation_id]
          properties:
            for_product_id: { type: string }
            relation_id: { type: string }
    Companion:
      type: object
      description: Позиция блока «Дополните решение»
      properties:
        product_id: { type: string }
        family_id: { type: string }
        title: { type: string }
        vendor: { type: string }
        category: { type: string }
        license_line: { type: string }
        price_rub: { type: [number, "null"] }
        price_mode: { type: string }
        class: { type: string, enum: [conditional_required, compatible, complement, upgrade, renewal] }
        compatibility: { type: string, enum: [verified, conditional, unknown] }
        reason: { type: string }
        conditions: { type: array, items: { type: string } }
        evidence_level: { type: string }
        source: { type: string }
        source_url: { type: string }
        suggested_quantity: { type: [integer, "null"] }
        label: { type: string }
        upgrade_adds: { type: array, items: { type: string } }
        evidence:
          type: object
          description: >-
            Контур фида–7, фид: основание карточки. A — документ вендора о совместимости (compat_document, ссылка в url),
            B — каталог (license_kind — тип лицензии в семействе; sku_platform — название позиции называет платформу)
            или логика класса (class_logic — строка таблицы «класс запроса → класс дополнения» заказчика, ссылки нет;
            подпись на фронте «по логике класса: <reason>»), C — проверьте совместимость. Даты нет.
          properties:
            level: { type: string, enum: [A, B, C] }
            kind: { type: string, enum: [compat_document, license_kind, sku_platform, class_logic] }
            title: { type: string }
            url: { type: string }
            doc_number: { type: string }
        offer_url: { type: string }
        family_url: { type: string }
        promos: { type: array, items: { $ref: "#/components/schemas/ItemPromo" } }
        badges: { type: array, items: { type: string }, description: "«Скидка N%» по old_price, «Акция» при действующей акции" }
    ItemPromo:
      type: object
      description: Акция магазина на карточке (только с подтверждённым сроком; срок не выводится)
      properties:
        id: { type: string }
        title: { type: string }
        text: { type: string, description: "«Акция: …, условия по ссылке»" }
        url: { type: string }
    PanelTogether:
      type: object
      description: Дополнение в строке подсказок «Вместе с этим» (контур эталонов)
      required: [anchor_family_id, family_id, family_name, product_id, title, vendor, price_rub, reason, level, kind, label]
      properties:
        anchor_family_id: { type: string, description: "к какому семейству подсказки (первое в products)" }
        family_id: { type: string }
        family_name: { type: string }
        product_id: { type: string }
        title: { type: string }
        vendor: { type: string }
        price_rub: { type: [number, "null"] }
        reason: { type: string, description: "причина из таблицы классов; у A — плюс документ" }
        level: { type: string, enum: [A, B] }
        kind: { type: string, enum: [class_logic, compat_document] }
        label: { type: string, description: "класс дополнения: «Антивирус для организаций», «Резервное копирование»…" }
        offer_url: { type: string }
        family_url: { type: string }
        source_url: { type: string, description: "ссылка на документ совместимости (у A)" }
    ProductPage:
      type: object
      description: "Страница товара. Массивы — всегда массивы; полей margin и popularity нет."
      required: [catalog_version, product_id, sku, mpn, kind, family_id, family_name, title, vendor, category, description,
        license_line, license, price_rub, price_on_request, price_mode, origin, reestr, attributes, specs, variants,
        compatibility, companions, analogs]
      properties:
        catalog_version: { type: string }
        product_id: { type: string }
        sku: { type: string, description: "пусто — артикул не указан" }
        mpn: { type: string, description: "парт-номер оборудования; пусто у ПО" }
        kind: { type: string, enum: [software, hardware] }
        family_id: { type: string }
        family_name: { type: string }
        title: { type: string }
        vendor:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            origin: { type: string, enum: [ru, foreign, ""], description: "происхождение позиции" }
        category:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        description: { type: string }
        license_line: { type: string, description: "«Подписка · 2 устройства · 1 год»; пусто у оборудования" }
        license:
          type: object
          properties:
            type: { type: string }
            metric: { type: [string, "null"] }
            quantity: { type: [integer, "null"] }
            duration_months: { type: [integer, "null"], description: "null — бессрочная" }
            edition: { type: string }
            kind: { type: string, enum: [base, renewal, upgrade, migration, support, module, course, other], description: "вид позиции по типу лицензии фида; в mock нет" }
            org_type: { type: string, description: "commercial | academic | government | nonprofit | home; в mock нет" }
            tier_min: { type: integer, description: "ступень цены за единицу «от N»" }
            tier_max: { type: [integer, "null"], description: "верхняя граница ступени" }
        price_rub: { type: [number, "null"] }
        price_on_request: { type: boolean }
        price_mode: { type: string, enum: [fixed, from, quote_required, customer_specific, unavailable] }
        origin: { type: string, enum: [ru, foreign, ""] }
        reestr:
          type: [object, "null"]
          description: "статус в реестре российского ПО (§12.6); null у оборудования"
          properties:
            status: { type: string, enum: [confirmed, not_matching, unknown] }
            number: { type: string }
            label: { type: string }
            checked_at: { type: string }
        attributes:
          type: array
          description: "атрибуты с подписью сервера; ключ без подписи не отдаётся; значение — строкой"
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: string }
        specs:
          type: array
          description: "числовые характеристики оборудования; [] у ПО"
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: number }
              unit: { type: string }
        variants:
          type: array
          description: "остальные позиции семейства: по цене, без цены — в конце, затем по названию"
          items:
            type: object
            properties:
              product_id: { type: string }
              title: { type: string }
              license_line: { type: string }
              price_rub: { type: [number, "null"] }
              price_on_request: { type: boolean }
              price_mode: { type: string }
        compatibility:
          type: array
          items:
            type: object
            properties:
              target_model: { type: string }
              state: { type: string, enum: [verified, conditional, incompatible, unknown] }
              condition: { type: string }
              source_url: { type: string }
        companions:
          type: object
          description: "подбор GET /api/companions (количество — license.quantity, иначе 1); FEATURE_COMPANIONS выключен — пустые списки"
          properties:
            required: { type: array, items: { $ref: "#/components/schemas/Companion" } }
            items: { type: array, items: { $ref: "#/components/schemas/Companion" } }
        analogs:
          type: array
          description: "связи substitute от семейства в действующем справочнике связей, до 5"
          items:
            type: object
            properties:
              family_id: { type: string }
              family_name: { type: string }
              product_id: { type: string }
              title: { type: string }
              vendor: { type: string }
              license_line: { type: string }
              price_rub: { type: [number, "null"] }
              price_on_request: { type: boolean }
              price_mode: { type: string }
              note: { type: string }
    SearchResponse:
      type: object
      properties:
        request_id: { type: string }
        query: { type: string }
        normalized: { type: string }
        config: { type: string }
        correction:
          type: object
          properties:
            from: { type: string }
            to: { type: string }
            confidence: { type: string, enum: [high, medium] }
            applied: { type: boolean }
        chips:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              value: { type: string }
              label: { type: string }
              strict: { type: boolean }
        clarify:
          type: object
          properties:
            attribute: { type: string }
            question: { type: string }
            options:
              type: array
              items:
                type: object
                properties:
                  value: { type: string }
                  label: { type: string }
        total: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }
        relaxed:
          type: array
          description: Какие условия ослаблены (тип, срок, количество, метрика у поштучных позиций)
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        empty:
          type: object
          description: Только когда точного товара нет; items могут содержать аналоги
          properties:
            message: { type: string }
            show_manager: { type: boolean }
            supply: { type: boolean, description: "Контур доводки: «Товара «…» нет в каталоге» — кнопка «Запросить поставку»" }
        related_queries: { type: array, items: { type: string } }
        complements:
          type: array
          description: «С этим покупают» (связи complement)
          items: { type: object, additionalProperties: true }
        companions:
          type: [object, "null"]
          description: >-
            «Дополните решение» (контур коммерции; на фиде — контуры фида–7: тип лицензии, документ совместимости, таблица классов,
            не больше четырёх карточек); null — блока нет
          properties:
            title: { type: string, description: "заголовок блока, настройка UPSELL_BLOCK_TITLE; по умолчанию «Дополните решение»" }
            anchor:
              type: object
              properties:
                product_id: { type: string }
                family_id: { type: string }
                confidence: { type: string, enum: [high, medium] }
            items: { type: array, items: { $ref: "#/components/schemas/Companion" } }
        solution:
          type: [object, "null"]
          description: Закупка под задачу по утверждённому шаблону; null — шаблона нет
          required: [template_id, title, seats, source, slots, total_rub, on_request]
          properties:
            template_id: { type: string }
            title: { type: string }
            seats: { type: integer, description: "число мест из запроса; нет — 1" }
            source: { type: string, description: "«Собрано по шаблону Softline»" }
            total_rub: { type: [number, "null"], description: "по активным слотам, только если известны все цены" }
            on_request: { type: integer }
            slots:
              type: array
              items:
                type: object
                required: [id, label, category_id, query, quantity_strategy, quantity, item, alternatives, quantities, active, condition]
                properties:
                  id: { type: string }
                  label: { type: string }
                  category_id: { type: string }
                  query: { type: string }
                  quantity_strategy: { type: string }
                  quantity: { type: integer, description: "штук выбранной позиции: ⌈мест / мест в позиции⌉ для per_seat|per_user|per_device, иначе 1" }
                  item: { oneOf: [{ $ref: "#/components/schemas/SearchItem" }, { type: "null" }] }
                  alternatives: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }
                  quantities: { type: object, additionalProperties: { type: integer }, description: "количество для выбранной и каждой альтернативы" }
                  active: { type: boolean, description: "условный слот нужен при выбранной позиции слота-условия" }
                  condition:
                    type: [object, "null"]
                    properties:
                      slot: { type: string }
                      key: { type: string }
                      value: { type: string }
                      product_ids: { type: array, items: { type: string } }
        upgrade:
          oneOf: [{ $ref: "#/components/schemas/Upgrade" }, { type: "null" }]
          description: «Старшая редакция» к первой позиции; null — связи upgrade нет
        counts:
          type: object
          description: |
            Контур выдачи (FEATURE_RESULTS_V3): «N продуктов · M вариантов» после фильтров, до limit. С контура фида
            поле есть всегда (без флага families/variants — по карточкам ответа) и дополнено числом разных SKU в карточках
            и их вариантах и числом карточек по match_type.
          properties:
            families: { type: integer }
            variants: { type: integer }
            skus: { type: integer }
            by_match_type: { type: object, additionalProperties: { type: integer } }
        refinements:
          type: array
          description: Контур выдачи, чипы-уточнения «+» над выдачей — тот же источник, что бейджи панели (без продолжений подсказок)
          items: { $ref: "#/components/schemas/Refinement" }
        sort:
          type: object
          description: Контур выдачи, применённая сортировка
          properties:
            value: { type: string }
            note: { type: string, examples: ["Рекомендуемые: по соответствию, затем популярность и выгода"] }
        group: { type: string, enum: [family, none] }
        facets:
          type: array
          description: |
            Фасеты характеристик выдачи (контур коммерции) и, при FEATURE_RESULTS_V3, лицензионные фасеты со счётчиками
            семейств (§11.5): только присутствующие в результатах, названные в запросе — наверх; [] — нет
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              unit: { type: string }
              type: { type: string, enum: [number, enum, bool] }
              min: { type: [number, "null"] }
              max: { type: [number, "null"] }
              values:
                type: array
                items:
                  type: object
                  properties:
                    value: {}
                    count: { type: integer }
                    label: { type: string, description: "подпись значения (лицензионные фасеты)" }
        purchase:
          type: [object, "null"]
          description: |
            Контур доводки: параметры закупки из запроса — если назван тип покупки, количество, срок,
            организация или редакция; тогда `price_from_rub` семейства — минимум по вариантам с `matches_query`.
            При названном типе покупки и вариантах в двух и больше редакциях — `clarify.attribute = edition`.
          properties:
            query: { type: string }
            deal: { type: string, enum: [new, renewal, extension, migration] }
            deal_label: { type: string }
            quantity: { type: [integer, "null"] }
            metric: { type: string }
            duration_months: { type: [integer, "null"] }
            org_type: { type: string, enum: [education, government, commercial, ""] }
            org_label: { type: string }
            edition: { type: string }
        help:
          oneOf: [{ $ref: "#/components/schemas/HelpAnswer" }, { type: "null" }]
          description: "Контур доводки: answer — вопрос, а не покупка (items пусто); hint — статья рядом с товаром (продление)"
        analog_original:
          type: [object, "null"]
          description: "Контур доводки: запрос замены — исходный продукт («Вы искали: …»), отдельно от аналогов"
          properties:
            family_id: { type: string }
            family_name: { type: string }
            product_id: { type: string }
            title: { type: string }
            vendor: { type: string }
            category: { type: string }
            price_from_rub: { type: [number, "null"] }
            reestr: { type: [object, "null"], additionalProperties: true }
        reestr_unconfirmed:
          type: array
          items: { $ref: "#/components/schemas/SearchItem" }
          description: "Контур доводки: при явном требовании реестра неподтверждённые убраны из items сюда"
        target:
          type: [object, "null"]
          description: |
            Контур фида цель ответа — первый кликабельный элемент. null — цели нет
            (бессмыслица, пустая выдача, B0–B2). sku — точный артикул или семейство без собранной страницы (промах
            покрытия — trace.steps[answer].coverage_miss); vendor_category — `<vendorUrl>?filter[category][]=<id категории
            второго уровня>`; category — url пустой (страниц категорий в фиде нет); service — url справки или пусто.
          properties:
            type: { type: string, enum: [sku, family, vendor, vendor_category, category, service] }
            url: { type: string }
            title: { type: string }
            reason: { type: string }
        clarifications:
          type: array
          description: "Контур фида: уточняющие чипы (формат Refinement, field=vendor) при равенстве семейств разных вендоров или общем слове-категории; [] — нет"
          items: { $ref: "#/components/schemas/Refinement" }
        comparison:
          type: object
          description: |
            строка сравнения цены за место — одна пара редакций одной линейки среди
            точных карточек при совпадении категории, вида и типа лицензии, типа организации, срока, ступени и метрики.
            Без «лучше», «самый выгодный» и без дат. Нет поля — сравнивать нечего.
          properties:
            text: { type: string, description: "«При этих условиях Стандартный на 31% дешевле, чем Расширенный, за узел»" }
            conditions: { type: string, description: "«Продление · 2 года · 100–149 устройств · для коммерческих организаций»" }
            percent: { type: integer }
            items:
              type: array
              description: "Пара: дешевле — первой"
              items:
                type: object
                properties:
                  product_id: { type: string }
                  family_id: { type: string }
                  name: { type: string, description: "Различающаяся часть названия семейства («Стандартный»)" }
                  title: { type: string }
                  per_place_rub: { type: number }
        trace: { $ref: "#/components/schemas/Trace" }
    HelpAnswer:
      type: object
      properties:
        id: { type: string }
        mode: { type: string, enum: [answer, hint] }
        title: { type: string }
        text: { type: string }
        link_label: { type: string }
        url: { type: string }
    Trace:
      type: object
      description: |
        Трасса запроса. Пропущенный шаг — skipped:true с причиной; числа — замеры. Шаг разбора
        намерения несёт `fallback_reason`, если разбор остался на правилах: llm_off | llm_not_configured |
        llm_error | schema_error | catalog_not_loaded | budget_exceeded (дневной бюджет LLM) | ip_quota (квота
        адреса покупателя на модель).
      properties:
        request_id: { type: string }
        route: { type: string, enum: [A, B, C, D] }
        parse_source: { type: string, enum: [rules, cache, llm] }
        config: { type: string }
        rules_version: { type: integer }
        total_ms: { type: number }
        cost_rub: { type: number }
        steps: { type: array, items: { type: object, additionalProperties: true } }
        items: { type: array, items: { type: object, additionalProperties: true } }
        rejected: { type: array, items: { type: object, additionalProperties: true } }
        llm:
          type: [object, "null"]
          properties:
            model: { type: string }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cached_tokens: { type: integer }
            ms: { type: number }
            cost_rub: { type: number }
            calls: { type: integer }
      additionalProperties: true
    Analytics:
      type: object
      properties:
        days: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        tiles:
          type: object
          properties:
            searches: { type: integer }
            empty: { type: integer }
            empty_rate: { type: [number, "null"] }
            no_click: { type: integer }
            no_click_rate: { type: [number, "null"] }
            orders: { type: integer }
            order_rate: { type: [number, "null"] }
            pending_proposals: { type: integer }
        funnel:
          type: array
          items:
            type: object
            properties:
              step: { type: string, enum: [searches, clicks, carts, orders] }
              label: { type: string }
              count: { type: integer }
              rate: { type: [number, "null"] }
        problems:
          type: array
          items:
            type: object
            properties:
              query: { type: string }
              freq: { type: integer }
              empty: { type: integer }
              no_click: { type: integer }
              reformulated: { type: integer }
              clicks: { type: integer }
              orders: { type: integer }
              failures: { type: integer }
              outcome: { type: string, enum: [empty, reformulated, no_click] }
              outcome_label: { type: string }
              diagnosis: { type: string }
              proposal_id: { type: [string, "null"], description: Предложение агента по кластеру этого запроса }
              proposal_status: { type: [string, "null"], enum: [pending, accepted, rejected, rolled_back, stale, null] }
              proposal_diagnosis: { oneOf: [{ $ref: "#/components/schemas/Diagnosis" }, { type: "null" }] }
              agent: { $ref: "#/components/schemas/AgentVerdict" }
              cause: { type: string, description: "Контур доводки: причина из семи по диагнозу агента; пусто — диагноза нет" }
              cause_label: { type: string }
              owner: { type: string, enum: [ecom, product, content, head, ""], description: Владелец причины }
              owner_label: { type: string }
        sources: { type: object, additionalProperties: { type: integer } }
    AgentVerdict:
      type: object
      description: Вывод агента по проблемному запросу — из его предложения или итога кластера последних запусков
      properties:
        code:
          type: string
          enum: [proposal, answers, closed, no_offer, earlier, queued, mostly_ok, unseen]
          description: |
            proposal — есть предложение; answers — действующий поиск уже отвечает; closed — разобран, правкой правил
            не решается; no_offer — спрос без предложения в каталоге; earlier — разобран в прежних запусках;
            queued — агент видел кластер, но не дошёл; mostly_ok — агент не брал: запрос чаще заканчивается кликом;
            unseen — агент кластер не видел.
        label: { type: string }
        note: { type: string, description: Пояснение агента (итог кластера) }
        diagnosis: { type: string, description: Код диагноза, если был }
        run_id: { type: string }
        cluster_id: { type: string }
        cluster_label: { type: string }
    ProblemsNow:
      type: object
      properties:
        days: { type: integer }
        rules_version: { type: integer, description: Версия правил, на которой проверяли }
        catalog_version: { type: string }
        checked_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              query: { type: string }
              total: { type: integer, description: Сколько товаров в выдаче }
              exact: { type: boolean, description: Первым стоит точный товар }
              not_in_catalog: { type: boolean, description: Поиск ответил «нет в каталоге» (аналоги или пусто) }
              top_title: { type: string }
              route: { type: string, enum: [A, B, C, D] }
              cached: { type: boolean, description: Ответ из кэша проверки (10 мин) }
              error: { type: string, description: Заполнено, если поиск по этому запросу не ответил }
    HoldoutRescued:
