services:
  db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuznica}
      POSTGRES_USER: ${POSTGRES_USER:-kuznica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # PostgreSQL 18+: данные в /var/lib/postgresql/<major>/docker, том монтируется на /var/lib/postgresql.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuznica} -d ${POSTGRES_DB:-kuznica}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: kuznica-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "0.0.0.0:8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-kuznica}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kuznica}?sslmode=disable
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set TRUSTED_PROXIES in .env}
      # Поиск и модели: пусто — шаг выключен (сервисы opensearch/embedder стенда — волна «Поставка»).
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      EMBEDDER_URL: ${EMBEDDER_URL:-}
      RERANKER_URL: ${RERANKER_URL:-}
      SEARCH_RERANK_WEIGHT: ${SEARCH_RERANK_WEIGHT:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FOLDER_ID: ${LLM_FOLDER_ID:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODE: ${LLM_MODE:-}
      LLM_INTENT_MODEL: ${LLM_INTENT_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-}
      LLM_DAILY_BUDGET_RUB: ${LLM_DAILY_BUDGET_RUB:-}
      AGENT_BUDGET_RESERVE_RUB: ${AGENT_BUDGET_RESERVE_RUB:-}
      LLM_PER_IP_DAILY_RUB: ${LLM_PER_IP_DAILY_RUB:-}
      FEATURE_HARDWARE: ${FEATURE_HARDWARE:-}
      FEATURE_COMPANIONS: ${FEATURE_COMPANIONS:-}
      FEATURE_MARGIN_POLICY: ${FEATURE_MARGIN_POLICY:-}
      FEATURE_SOLUTIONS: ${FEATURE_SOLUTIONS:-}
      BACKOFFICE_TOKEN: ${BACKOFFICE_TOKEN:?set BACKOFFICE_TOKEN in .env}
      # Вход по ролям: демо-кнопки для жюри, аккаунты по паролю, срок сессии.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-}
      DEMO_LOGIN_BUTTONS: ${DEMO_LOGIN_BUTTONS:-}
      AUTH_ACCOUNTS: ${AUTH_ACCOUNTS:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-}
      AUTH_LOGIN_PER_MIN: ${AUTH_LOGIN_PER_MIN:-}
      # Контур автономии: автономный агент — расписание и пороги триггера «всплеск».
      AGENT_SCHEDULE: ${AGENT_SCHEDULE:-}
      AGENT_SCHEDULE_INTERVAL: ${AGENT_SCHEDULE_INTERVAL:-}
      AGENT_SCHEDULE_AT: ${AGENT_SCHEDULE_AT:-}
      AGENT_SPIKE_WINDOW: ${AGENT_SPIKE_WINDOW:-}
      AGENT_SPIKE_MIN_SEARCHES: ${AGENT_SPIKE_MIN_SEARCHES:-}
      AGENT_SPIKE_EMPTY_SHARE: ${AGENT_SPIKE_EMPTY_SHARE:-}
      AGENT_SPIKE_REFORM_SHARE: ${AGENT_SPIKE_REFORM_SHARE:-}
      AGENT_SPIKE_QUERY_FREQ: ${AGENT_SPIKE_QUERY_FREQ:-}
      AGENT_SPIKE_COOLDOWN: ${AGENT_SPIKE_COOLDOWN:-}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Генератор mock-трафика (контур автономии): обычный клиент витрины, ходит в api по сети compose, пишет source=traffic.
  # Не стартует по умолчанию: docker compose --profile traffic up -d traffic.
  traffic:
    image: kuznica-api
    profiles: [traffic]
    restart: unless-stopped
    entrypoint: ["/app/api", "traffic"]
    command:
      - --api=http://api:8080
      - --data=/data/mock
      - --spikes-file=/data/traffic/spikes.json
      - --rate=${TRAFFIC_RATE:-2}
      - --max-rpm=${TRAFFIC_MAX_RPM:-120}
      - --spikes=${TRAFFIC_SPIKES:-sketchup-empty@2h,kasperych-reform@8h,chertilka-reform@14h}
      - --spike-len=${TRAFFIC_SPIKE_LEN:-12m}
      - --spike-sessions=${TRAFFIC_SPIKE_SESSIONS:-40}
      - --repeat=${TRAFFIC_REPEAT:-24h}
      - --quiet
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      TZ: Europe/Moscow
    volumes:
      - ../data:/data:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: kuznica-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Только для выключаемого basic_auth в Caddyfile (по умолчанию закомментирован: вход — на сайте).
      BACKOFFICE_USER: ${BACKOFFICE_USER:-manager}
      BACKOFFICE_HASH: ${BACKOFFICE_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
